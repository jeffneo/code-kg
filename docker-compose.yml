name: codekg

services:
  neo4j:
    # 2025.x+ required - the load path uses Cypher's built-in coll.distinct().
    image: ${NEO4J_IMAGE:-neo4j:2026.07-enterprise}
    container_name: codekg-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-codekgcodekg}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "eval"
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-4G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-2G}
      # GDS Enterprise. Without this the plugin still loads but runs in the
      # community tier, which caps graph projections and blocks several
      # algorithms outright. Config key is gds.enterprise.license_file; in env
      # form, dots become '_' and literal underscores become '__'.
      NEO4J_gds_enterprise_license__file: /licenses/gds.license
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      # Licenses are referenced, never copied into the image or committed.
      - ${GDS_LICENSE_PATH:-./gds.license}:/licenses/gds.license:ro
    healthcheck:
      # cypher-shell against the real bolt endpoint; HTTP 200 lies during startup.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-codekgcodekg} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Neo4j Enterprise Studio - Query, Bloom, and Dashboards over the codekg graph.
  # Both services sit behind the `nes` profile so `make up` stays fast; bring
  # them up with `make nes`.
  # ---------------------------------------------------------------------------

  # One-shot provisioner: service account, asset database, Bloom/sharing grants.
  nes-init:
    image: ${NEO4J_IMAGE:-neo4j:2026.07-enterprise}
    container_name: codekg-nes-init
    profiles: ["nes"]
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./cypher/nes-setup.cypher:/nes-setup.cypher:ro
    entrypoint:
      - /bin/sh
      - -c
      - >
        cypher-shell -a neo4j://neo4j:7687
        -u neo4j -p ${NEO4J_PASSWORD:-codekgcodekg}
        -d system -f /nes-setup.cypher
    restart: "no"

  enterprise-studio:
    image: neo4j/enterprise-studio:latest
    container_name: codekg-nes
    profiles: ["nes"]
    depends_on:
      nes-init:
        condition: service_completed_successfully
    ports:
      - "${NES_PORT:-8080}:8080"
    volumes:
      # Referenced, not copied - a license is a secret. It lives at the repo
      # root and is gitignored. Override NES_LICENSE_PATH if yours is elsewhere.
      - ${NES_LICENSE_PATH:-./nes.license}:/licenses/nes.license:ro
    environment:
      NES_license_path: "/licenses/nes.license"
      NES_server_port: "8080"

      # Where Studio persists dashboards, saved queries, and Perspectives.
      # Must match cypher/nes-setup.cypher.
      NES_assetStore_default_uri: "neo4j://neo4j:7687"
      NES_assetStore_default_database: "tools-storage"
      NES_assetStore_default_authentication_basic_username: "tools_service"
      NES_assetStore_default_authentication_basic_password: "toolspassword"

      # The deployment users query. Proxy mode over the HTTP connector.
      NES_neo4jDeployments_codekg_name: "codekg"
      NES_neo4jDeployments_codekg_uri: "http://neo4j:7474"
    healthcheck:
      # The Studio image ships no curl or wget, so the documented curl probe
      # cannot run here. Check the listener on 8080 (hex 1F90) via /proc instead.
      test: ["CMD-SHELL", "grep -q ':1F90 ' /proc/net/tcp6 /proc/net/tcp 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Extractor. Runs graphify over one repo and writes graph.json to /out.
  # Not a long-running service - invoked per repo via `docker compose run`.
  graphify:
    build:
      context: ./extractors/graphify
    container_name: codekg-graphify
    profiles: ["tools"]
    volumes:
      # Corpus is copied into a named volume rather than bind-mounted from the
      # host. macOS virtiofs drops inotify events, which breaks any extractor
      # that relies on file watching (relevant once CodeGraph is added).
      - corpus:/corpus
      - artifacts:/out
    working_dir: /corpus
    environment:
      GRAPHIFY_TELEMETRY: "0"

  # CodeGraph extractor. SQLite store, so its ETL is a SELECT not a parse.
  codegraph:
    build:
      context: ./extractors/codegraph
    container_name: codekg-codegraph
    profiles: ["tools"]
    volumes:
      - corpus:/corpus:ro
      - artifacts:/out
    environment:
      CODEGRAPH_TELEMETRY: "0"

  # GitNexus extractor. Embedded LadybugDB store, exported via its own `cypher`
  # command - see extractors/gitnexus/extract.sh.
  gitnexus:
    build:
      context: ./extractors/gitnexus
    container_name: codekg-gitnexus
    profiles: ["tools"]
    volumes:
      - corpus:/corpus:ro
      - artifacts:/out

  # Go AST analyzer. Emits (file, module, symbol) refs and exported defs, which
  # is what Python's stdlib `ast` gives the oracle for free and Go does not.
  goscan:
    build:
      context: ./extractors/goscan
    container_name: codekg-goscan
    profiles: ["tools"]
    volumes:
      - corpus:/corpus:ro
      - artifacts:/out

  # Normalizes extractor artifacts into the canonical schema and loads Neo4j.
  loader:
    build:
      context: ./loader
    container_name: codekg-loader
    profiles: ["tools"]
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - corpus:/corpus
      - artifacts:/artifacts
      - ./cypher:/cypher:ro
      - ./corpus/corpus.yaml:/config/corpus.yaml:ro
      - ./corpus/corpus.lock.yaml:/config/corpus.lock.yaml:ro
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-codekgcodekg}
      CORPUS_CONFIG: /config/corpus.yaml
      CORPUS_LOCK: /config/corpus.lock.yaml
      ARTIFACTS_DIR: /artifacts
      CORPUS_DIR: /corpus

volumes:
  neo4j-data:
  neo4j-logs:
  corpus:
  artifacts:

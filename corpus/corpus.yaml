# Source corpora for the multi-repo code knowledge graph harness.
#
# Two corpora, chosen for different jobs:
#   A (neo4j-python) - credibility + fast iteration + eyeball-validatable
#   B (grafana-go)   - exact, machine-checkable ground truth from go.mod
#
# `publishes` is the package identity this repo produces. It is the join key
# for cross-repo resolution: another repo's unresolved import of this name
# resolves to a symbol in this repo.
#
# `ref` is a branch or tag for the FIRST fetch only. fetch.sh resolves it to a
# commit SHA and writes corpus.lock.yaml. After that the SHA is authoritative.
# Ground truth is version-specific; a dependency bump silently invalidates scores.

corpora:
  a:
    name: neo4j-python
    description: >
      Neo4j's own Python dependency DAG. Two hops deep with fan-in at the top.
      Roughly 100-150k LOC total, so the extract/load/query loop stays fast.
    ecosystem: python
    repos:
      - id: neo4j-python-driver
        url: https://github.com/neo4j/neo4j-python-driver
        ref: 6.x                 # default branch; 5.x exists as tags, not a branch
        publishes: [neo4j]
        tier: core

      # Owned by langchain-ai, not neo4j - worth knowing before you describe
      # this corpus as "all Neo4j code". It is still the real dependency:
      # llm-graph-builder pins langchain-neo4j==0.10.0, and the package source
      # lives under libs/neo4j rather than the repo root.
      - id: langchain-neo4j
        url: https://github.com/langchain-ai/langchain-neo4j
        ref: main
        publishes: [langchain-neo4j]
        subpath: libs/neo4j
        tier: core

      - id: graph-data-science-client
        url: https://github.com/neo4j/graph-data-science-client
        ref: main
        publishes: [graphdatascience]
        tier: core

      - id: neo4j-graphrag-python
        url: https://github.com/neo4j/neo4j-graphrag-python
        ref: main
        publishes: [neo4j-graphrag]
        tier: core

      - id: llm-graph-builder
        url: https://github.com/neo4j-labs/llm-graph-builder
        ref: main
        publishes: []          # top of the DAG, consumer only
        subpath: backend       # the Python app lives here
        tier: core

  b:
    name: grafana-go
    description: >
      grafana/dskit consumed by the LGTM stack. Go import paths are fully
      qualified and name the publishing repo, so the answer key is exact and
      free. One-to-many fan-out makes the blast-radius query land visually.
    ecosystem: go
    repos:
      - id: dskit
        url: https://github.com/grafana/dskit
        ref: main
        publishes: [github.com/grafana/dskit]
        tier: core

      - id: mimir
        url: https://github.com/grafana/mimir
        ref: main
        publishes: [github.com/grafana/mimir]
        tier: core           # smallest of the three consumers; the "lite" consumer

      - id: loki
        url: https://github.com/grafana/loki
        ref: main
        publishes: [github.com/grafana/loki/v3]
        tier: full

      - id: tempo
        url: https://github.com/grafana/tempo
        ref: main
        publishes: [github.com/grafana/tempo]
        tier: full

  c:
    name: sqlalchemy-cycles
    description: >
      One repo, one job: circular dependencies that are real and provable.
      Deliberately NOT part of the cross-repo scoring - a single repo has no
      cross-repo truth to measure, and mixing it into corpus A would pollute
      those numbers.

      Why SQLAlchemy. Ground truth arrives three independent ways, which is the
      same standard the manifest-derived cross-repo oracle is held to:

        1. The maintainers say so, as a named subsystem. lib/sqlalchemy/util/
           preloaded.py exists to "resolve circular module imports at runtime".
           A module whose stated job is the problem is not arguable.
        2. pylint's cyclic-import check reports them independently.
           `make score-cycles CORPUS=c` scores the graph against it.
        3. Two distinct 7-module runtime cycles in the ORM core, top-level and
           facade-free, confirmed against an AST scanner written separately
           from the loader.

      For contrast the same repo carries a 98-module DESIGN-time component once
      TYPE_CHECKING edges are included - real coupling, zero runtime risk. That
      gap is the exhibit, not a single big number.
    ecosystem: python
    repos:
      - id: sqlalchemy
        url: https://github.com/sqlalchemy/sqlalchemy
        ref: main
        subpath: lib            # src-layout: the importable root is lib/, not the repo root
        publishes: [sqlalchemy]
        tier: core

  d:
    name: airflow-xrepo-cycle
    description: >
      A dependency cycle that CROSSES a distribution boundary - the case no
      single-repo tool can see, because when either side is parsed the other
      end is not in scope.

      apache-airflow-core and apache-airflow-task-sdk are separately published,
      separately versioned PyPI distributions that REQUIRE EACH OTHER at
      runtime, in non-extra dependencies:

        airflow-core/pyproject.toml:154   apache-airflow-task-sdk<1.5.0,>=1.4.0
        task-sdk/pyproject.toml:51        apache-airflow-core<3.5.0,>=3.4.0

      Those ranges are the exhibit. Neither can be released without the other
      already existing in a compatible version, which is the release deadlock a
      cross-boundary cycle actually costs you.

      The code cycle is real, top-level, and asymmetric: 109 import statements
      core -> task-sdk against 7 the other way. The 7 are the cut set. That is
      an actionable finding, and it is only visible with both sides in one
      graph.

      HONEST FRAMING: these are two distributions inside ONE repository
      (apache/airflow), not two repositories. What makes them separate
      dependency endpoints is that they version, publish and release
      independently - which is what causes the deadlock. Say "distribution", not
      "repository", and the exhibit holds up. `dist` gives each its own :Repo id
      so they do not collapse into one node.

      Both distributions also publish into the SAME `airflow` namespace package,
      so the import name matches neither distribution name. That breaks the
      top-level-module resolution rule and is why the linking pass needed exact
      module-path matching - see `python-module-path` in 10_link_cross_repo.cypher.
    ecosystem: python
    repos:
      - id: airflow-core
        url: https://github.com/apache/airflow
        ref: main
        dist: airflow-core           # own :Repo id; a shared clone URL would collide
        subpath: airflow-core/src    # extraction + module naming root
        manifest_subpath: airflow-core   # pyproject.toml sits a level above src/
        publishes: [apache-airflow-core]
        tier: core

      - id: task-sdk
        url: https://github.com/apache/airflow
        ref: main
        dist: task-sdk
        subpath: task-sdk/src
        manifest_subpath: task-sdk
        publishes: [apache-airflow-task-sdk]
        tier: core

# Generated code inflates node counts and wrecks centrality metrics - your
# "god nodes" become generated deep-copy functions. Excluded at extract time.
exclude:
  globs:
    - "**/vendor/**"
    - "**/node_modules/**"
    - "**/testdata/**"
    - "**/*.pb.go"
    - "**/*_generated.go"
    - "**/zz_generated*.go"
    - "**/*_pb2.py"
    - "**/*_pb2_grpc.py"
    - "**/generated/**"
    - "**/.venv/**"
    - "**/dist/**"
    - "**/build/**"

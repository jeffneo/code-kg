[project]
name = "codekg"
version = "0.1.0"
description = "Normalize code-graph extractor artifacts into a unified multi-repo Neo4j graph"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.28,<6",
    "pyyaml>=6.0",
]

[project.scripts]
codekg = "codekg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codekg"]
